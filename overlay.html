<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIST ANTRI</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;font-family:Arial,Helvetica,sans-serif;color:#fff}
.overlay{width:390px;margin:24px;padding:9px 9px 10px;border-radius:8px;background:linear-gradient(180deg,rgba(18,18,20,.94),rgba(5,5,7,.94));border:1px solid rgba(255,255,255,.08);box-shadow:0 8px 24px rgba(0,0,0,.38)}
.header{text-align:center;height:38px;display:flex;flex-direction:column;justify-content:center}.title{font-size:22px;font-weight:900;letter-spacing:.8px;text-shadow:0 1px 3px #000}.sub{margin-top:3px;font-size:7px;font-weight:900;letter-spacing:3px;color:#d8323e}
.rows{display:flex;flex-direction:column;gap:5px}.row{height:48px;display:grid;grid-template-columns:33px minmax(0,1fr) 50px;align-items:center;padding:4px 8px 4px 5px;border-radius:7px;background:linear-gradient(90deg,rgba(35,35,38,.98),rgba(17,17,19,.98));border:1px solid rgba(255,255,255,.07);box-shadow:inset 0 1px rgba(255,255,255,.035)}.row:first-child{background:linear-gradient(90deg,rgba(52,31,35,.98),rgba(24,20,23,.98));border-color:rgba(235,55,68,.45)}
.badge{width:25px;height:25px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:#cfd1d6;color:#26272b;font-size:12px;font-weight:900}.row:first-child .badge{background:#e63a47;color:#fff}
.info{min-width:0;padding-left:3px}.name{font-size:11px;line-height:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{margin-top:2px;font-size:9px;color:#eee;font-weight:700}.right{display:flex;flex-direction:column;align-items:flex-end;gap:2px}.points{font-size:10px;font-weight:900}.live{padding:3px 6px 2px;border-radius:5px;background:#e63a47;color:#fff;font-size:6px;line-height:7px;font-weight:900;letter-spacing:.2px}
</style>
</head>
<body>
<div class="overlay"><div class="header"><div class="title">LIST ANTRI</div><div class="sub">• ANTRIAN •</div></div><div class="rows" id="rows"></div></div>
<script>
const fallback=[
{name:"@relwindser",score:"444",live:true},
{name:"cba @chaplink",score:"444"},
{name:"@hyyzzncksta",score:"444"},
{name:"tiktok @nublas kew coba bang",score:"444"},
{name:"Kako ini murni ga @cyloo010",score:"444"}];
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function render(a){document.getElementById("rows").innerHTML=(a||[]).map((x,i)=>`<div class="row"><div class="badge">${i+1}</div><div class="info"><div class="name">${esc(x.name)}</div><div class="score">${esc(x.score)}</div></div><div class="right"><div class="points">${esc(x.score)}</div>${x.live?'<div class="live">LIVE</div>':''}</div></div>`).join("")}
function load(){try{let a=JSON.parse(localStorage.getItem("listAntriData"));if(Array.isArray(a)){render(a);return}}catch(e){}render(fallback)}
load();setInterval(load,1000);
</script>
</body></html>
