<!doctype html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit LIST ANTRI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#eee;font-family:Arial;padding:24px}.box{max-width:760px;margin:auto;background:#151515;border:1px solid #333;border-radius:12px;padding:20px}h1{font-size:22px;margin:0 0 5px}.hint{font-size:12px;color:#999;margin-bottom:18px}.item{display:grid;grid-template-columns:34px 1fr 100px 70px;gap:7px;margin:7px 0}.item input{width:100%;padding:9px;background:#080808;color:#fff;border:1px solid #444;border-radius:6px}.num{display:flex;align-items:center;justify-content:center;background:#292929;border-radius:6px}.btn{padding:9px 12px;border:0;border-radius:6px;font-weight:800;cursor:pointer}.add{background:#eee;color:#111}.save{background:#e63a47;color:#fff}.del{background:#333;color:#fff}.bar{display:flex;gap:7px;margin-top:15px}.status{margin-top:12px;font-size:12px;color:#aaa}
</style></head>
<body><div class="box"><h1>EDIT LIST ANTRI</h1><div class="hint">Ubah nama/angka lalu klik SIMPAN. Data tersimpan di browser ini dan dipakai oleh overlay pada browser/origin yang sama.</div><div id="items"></div><div class="bar"><button class="btn add" onclick="add()">+ TAMBAH</button><button class="btn save" onclick="save()">SIMPAN</button><button class="btn del" onclick="clearAll()">KOSONGKAN</button></div><div id="status" class="status"></div></div>
<script>
let data=[{name:"@relwindser",score:"444",live:true},{name:"cba @chaplink",score:"444"},{name:"@hyyzzncksta",score:"444"},{name:"tiktok @nublas kew coba bang",score:"444"},{name:"Kako ini murni ga @cyloo010",score:"444"}];
try{let x=JSON.parse(localStorage.getItem("listAntriData"));if(Array.isArray(x))data=x}catch(e){}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;")}
function render(){document.getElementById("items").innerHTML=data.map((x,i)=>`<div class="item"><div class="num">${i+1}</div><input value="${esc(x.name)}" oninput="data[${i}].name=this.value"><input value="${esc(x.score)}" oninput="data[${i}].score=this.value"><button class="btn del" onclick="data.splice(${i},1);render()">HAPUS</button></div>`).join("")}
function add(){data.push({name:"Nama baru",score:"444"});render()}
function clearAll(){data=[];render()}
function save(){localStorage.setItem("listAntriData",JSON.stringify(data));document.getElementById("status").textContent="✓ Tersimpan."}
render();
</script></body></html>
